<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#05020c;--ink:#f4f0ff;--mute:#9a93b8;--m:#ff3ea5;--b:#3d7bff;--v:#8a5cff;--glass:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--hf:"Space Grotesk",system-ui,sans-serif}
html{scroll-behavior:smooth;scroll-padding-top:80px}*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
@media(pointer:fine){body,a,button{cursor:none}}
h1,h2,h3{font-family:var(--hf);margin:0;line-height:1}a{color:inherit}:focus-visible{outline:2px solid var(--m);outline-offset:3px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#pb{position:fixed;top:0;left:0;height:3px;width:0;z-index:60;background:linear-gradient(90deg,var(--m),var(--b))}
.dot,.ring{position:fixed;top:0;left:0;pointer-events:none;z-index:100;border-radius:50%;display:none}
@media(pointer:fine){.dot,.ring{display:block}}
.dot{width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--m);box-shadow:0 0 14px var(--m)}
.ring{width:40px;height:40px;margin:-20px 0 0 -20px;border:1px solid var(--b);transition:width .3s,height .3s,margin .3s,background .3s}.ring.h{width:64px;height:64px;margin:-32px 0 0 -32px;background:rgba(61,123,255,.15)}
main,nav,footer{position:relative;z-index:2}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:16px clamp(18px,5vw,56px);backdrop-filter:blur(14px);background:linear-gradient(rgba(5,2,12,.8),transparent)}
nav b{font:700 20px var(--hf)}nav b i{color:var(--m);font-style:normal}
nav .l a{margin:0 14px;text-decoration:none;color:var(--mute);font-size:14px}nav .l a:hover{color:var(--ink)}
.btn{display:inline-block;padding:13px 26px;border-radius:99px;text-decoration:none;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);transition:transform .25s,box-shadow .25s}
.btn.p{border:0;background:linear-gradient(110deg,var(--m),var(--v) 55%,var(--b));box-shadow:0 8px 30px -8px var(--m)}.btn:hover{transform:translateY(-3px)}
.hero{min-height:100svh;max-width:1300px;margin:auto;padding:90px clamp(18px,5vw,56px) 40px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:20px}
.lab{display:inline-flex;gap:10px;align-items:center;padding:7px 16px;border:1px solid var(--line);border-radius:99px;background:var(--glass);font-size:13px;letter-spacing:.12em;text-transform:uppercase;animation:up 1s .2s both}
.lab i{width:8px;height:8px;border-radius:50%;background:var(--m);box-shadow:0 0 12px var(--m);animation:bl 1.4s infinite}@keyframes bl{50%{opacity:.25}}
.hero h1{font-size:clamp(38px,6vw,96px);text-transform:uppercase;letter-spacing:-.035em;margin:22px 0}
.ln{display:block;overflow:hidden;padding:.04em 0 .1em}.ln span{display:block;transition:transform .65s cubic-bezier(.7,0,.2,1),opacity .65s}
.ln.o span{transform:translateY(-105%);opacity:0}.ln.n span{transition:none;transform:translateY(105%)}
.ln+.ln span{background:linear-gradient(100deg,var(--m),var(--v) 50%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);max-width:470px;font-size:clamp(15px,1.6vw,18px);animation:up 1s .5s both}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;animation:up 1s .7s both}
@keyframes up{from{opacity:0;transform:translateY(34px)}}
.vis{position:relative;justify-self:end;height:min(88svh,820px);aspect-ratio:941/1672;animation:fi 1.8s .3s both}@keyframes fi{from{opacity:0;transform:scale(.94)}}
.vis::before{content:"";position:absolute;inset:-12% -30%;background:radial-gradient(40% 40% at 28% 38%,rgba(255,62,165,.5),transparent),radial-gradient(40% 40% at 76% 42%,rgba(61,123,255,.5),transparent);filter:blur(50px);animation:pu 6s ease-in-out infinite alternate}@keyframes pu{to{opacity:.55;transform:scale(1.08)}}
#gl,.fb{position:absolute;inset:0;width:100%;height:100%;display:block}
.fb{object-fit:cover;-webkit-mask-image:radial-gradient(closest-side,#000 65%,transparent);mask-image:radial-gradient(closest-side,#000 65%,transparent)}
section{max-width:1200px;margin:auto;padding:100px clamp(18px,5vw,56px)}
.k{font-size:12px;letter-spacing:.3em;color:var(--m);text-transform:uppercase;font-weight:600;margin-bottom:14px;display:block}
h2{font-size:clamp(32px,5.5vw,68px);letter-spacing:-.03em;margin-bottom:30px}h2 em{font-style:normal;background:linear-gradient(100deg,var(--m),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.rv{opacity:0;transform:translateY(36px);transition:opacity .9s,transform .9s cubic-bezier(.2,.9,.2,1)}.rv.in{opacity:1;transform:none}
.ab{display:grid;grid-template-columns:.8fr 1.2fr;gap:50px;align-items:center}
.pc{position:relative;border-radius:30px;padding:3px;background:conic-gradient(from var(--a,0deg),var(--m),var(--b),var(--v),var(--m));animation:sp 6s linear infinite;transform-style:preserve-3d;transition:transform .2s}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}@keyframes sp{to{--a:360deg}}
.pc img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 22%;border-radius:27px;background:#000}
.st{position:absolute;left:16px;bottom:16px;right:16px;padding:12px 16px;border-radius:16px;background:rgba(5,2,12,.65);backdrop-filter:blur(12px);border:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:14px}
.st i{width:9px;height:9px;border-radius:50%;background:#3dff9a;box-shadow:0 0 12px #3dff9a}
.ab p{color:var(--mute);font-size:18px;max-width:560px;margin:0 0 26px}
.sts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.sts div{padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--glass)}.sts b{display:block;font:700 30px var(--hf)}.sts span{color:var(--mute);font-size:13px}
.mq{overflow:hidden;margin-bottom:14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mq div{display:flex;gap:12px;width:max-content;animation:mq 38s linear infinite}.mq.r div{animation-direction:reverse;animation-duration:46s}.mq:hover div{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mq span{padding:13px 24px;border-radius:99px;border:1px solid var(--line);background:var(--glass);white-space:nowrap;font-weight:500;transition:.3s}.mq span:hover{background:linear-gradient(110deg,var(--m),var(--b));border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
.pj{position:relative;border-radius:24px;border:1px solid var(--line);background:var(--glass);overflow:hidden;transition:transform .3s,border-color .3s}.pj:hover{transform:translateY(-8px);border-color:var(--m)}
.pj::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,62,165,.22),transparent 60%);opacity:0;transition:opacity .3s}.pj:hover::after{opacity:1}
.pv{aspect-ratio:16/10;display:grid;place-items:center;font:700 76px var(--hf);background:linear-gradient(135deg,var(--a1),var(--a2));text-shadow:0 0 40px rgba(0,0,0,.4)}
.pj .t{padding:22px 24px 26px}.pj h3{font-size:24px;margin-bottom:8px}.pj p{color:var(--mute);margin:0 0 14px;font-size:15px}
.lk{display:inline-block;margin-top:8px;font-weight:600;text-decoration:none;color:var(--m)}.lk:hover{text-decoration:underline}.tg span{display:inline-block;font-size:12px;padding:3px 12px;margin:0 6px 6px 0;border:1px solid var(--line);border-radius:99px;color:var(--b)}
.ct{text-align:center;padding-bottom:30px}.ct a.big{display:inline-block;font:700 clamp(22px,5.5vw,64px) var(--hf);text-decoration:none;overflow-wrap:anywhere;border-bottom:3px solid var(--m)}
.soc{margin-top:26px;display:flex;gap:24px;justify-content:center;flex-wrap:wrap;color:var(--mute)}
.gn{font:700 clamp(54px,17vw,260px)/.85 var(--hf);text-align:center;text-transform:uppercase;letter-spacing:-.05em;margin-top:50px;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.22);background:linear-gradient(100deg,var(--m),var(--v),var(--b),var(--m)) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;transition:color .6s;white-space:nowrap;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent);animation:gs 8s linear infinite}
.gn:hover{color:transparent;-webkit-text-stroke:0}@keyframes gs{to{background-position:300% 0}}
footer{text-align:center;padding:10px 20px 30px;color:var(--mute);font-size:13px}
@media(max-width:800px){
nav .l{display:none}.hero{grid-template-columns:1fr;padding-top:84px;gap:0;text-align:left}
.vis{order:-1;justify-self:center;height:46svh}.hero h1{font-size:clamp(36px,12.5vw,70px);margin:16px 0}
section{padding:70px 18px}.ab{grid-template-columns:1fr;gap:30px}.pc{max-width:360px;margin:auto}.sts b{font-size:24px}.btn{padding:12px 22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;transition:none!important}.rv{opacity:1;transform:none}}
